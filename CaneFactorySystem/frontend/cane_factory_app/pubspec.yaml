name: cane_factory_app
description: Factory Cane Weighment + Payment + Loan + Farmer Management System (Windows / Android / iOS / Web)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  signalr_netcore: ^1.3.9
  flutter_tts: ^4.0.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  printing_ffi: ^0.0.11
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
